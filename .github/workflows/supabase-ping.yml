# Evita que Supabase (plan gratis) pause el proyecto por inactividad (~7 días).
# Hace una consulta de solo lectura con la clave pública a "fichas" (la misma que la app ya lee públicamente).
name: Ping a Supabase

on:
  schedule:
    - cron: "0 13 * * 1,4" # lunes y jueves, 8:00 a. m. hora Colombia (dos veces por si una falla)
  workflow_dispatch: # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          curl --fail --silent --show-error \
            "https://tbdcubsyfswghhgygsze.supabase.co/rest/v1/fichas?select=*&limit=1" \
            -H "apikey: sb_publishable_WCZAF5yCHMCjkA74e7SlWw_WWV46HwY"
